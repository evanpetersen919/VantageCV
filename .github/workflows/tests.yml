name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (excluding live UE5 integration tests)
        run: pytest -m "not live_ue5" --cov=vantagecv --cov-report=term-missing -v

  lint:
    name: flake8 (informational, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # This codebase is not lint-clean yet (see CLAUDE.md) -- this job is
        # informational only and must never block a PR from merging.
        continue-on-error: true
        run: flake8 vantagecv/ scripts/ tests/
